services:
  postgres:
    image: postgres:16-alpine
    container_name: fundfusion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundfusion
      POSTGRES_PASSWORD: fundfusion_dev_only
      POSTGRES_DB: fundfusion_dev
    ports:
      - "5432:5432"
    volumes:
      - fundfusion_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundfusion -d fundfusion_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fundfusion-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - fundfusion_redis:/data

volumes:
  fundfusion_pg:
  fundfusion_redis:

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexorapay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_dev_only
      POSTGRES_DB: nexorapay
    ports:
      - "5432:5432"
    volumes:
      - nexora_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexorapay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexorapay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - nexora_redis:/data

volumes:
  nexora_pg:
  nexora_redis:
